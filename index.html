<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>定期預金 利息ダッシュボード</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style-v19.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>定期預金 利息ダッシュボード</h1>
    </div>
    <button id="addDepositButton" class="primary-button">＋ 定期を登録</button>
  </header>

  <nav class="view-nav" aria-label="画面切り替え">
    <div class="view-nav-inner">
      <a href="#dashboard" data-view-link="dashboard">概要</a>
      <a href="#active" data-view-link="active">運用中 <span id="activeNavCount">0</span></a>
      <a href="#matured" data-view-link="matured">満期済み <span id="maturedNavCount">0</span></a>
      <a href="#fx-details" data-view-link="fx-details">為替差損益明細</a>
    </div>
  </nav>

  <main class="container">
    <section id="dashboardView" class="app-view">
    <section class="surplus-panel">
      <div class="surplus-heading">
        <h2>余剰資金</h2>
        <button id="clearSurplusButton" class="compact-button" type="button">入力を消去</button>
      </div>
      <div class="surplus-fields">
        <label>
          余剰資金の額
          <div class="input-with-unit">
            <span>¥</span>
            <input id="surplusAmount" type="number" min="0" step="1" inputmode="decimal" placeholder="0" />
          </div>
        </label>
        <label>
          期待金利（年率）
          <div class="input-with-unit unit-right">
            <input id="surplusAnnualRate" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0.000" />
            <span>%</span>
          </div>
        </label>
        <div class="surplus-result">
          <span>1日当たり利息</span>
          <strong id="surplusDailyInterest">¥0.00</strong>
          <small id="surplusDailyInterestNet">（税引後 ¥0.00）</small>
        </div>
      </div>
    </section>

    <section class="fx-toolbar">
      <div>
        <h2>為替関連</h2>
      </div>
      <div class="fx-related-fields">
        <div class="fx-rate-entry">
          <label for="manualUsdRate">USD現在レート（1 USD = 円）</label>
          <div class="fx-rate-controls">
            <input id="manualUsdRate" type="number" min="0.000001" step="0.000001" inputmode="decimal" placeholder="例：157.30" />
            <button id="applyFxRateButton" class="secondary-button">反映</button>
          </div>
        </div>
        <label>
          FX決済損益（円）
          <div class="input-with-unit">
            <span>¥</span>
            <input id="fxSettledProfit" type="number" step="1" inputmode="decimal" placeholder="0" />
          </div>
        </label>
        <label>
          FX未決済損益（円）
          <div class="input-with-unit">
            <span>¥</span>
            <input id="fxUnsettledProfit" type="number" step="1" inputmode="decimal" placeholder="0" />
          </div>
        </label>
      </div>
    </section>

    <section class="summary-grid">
      <article class="summary-card fx-featured">
        <span>為替関連損益</span>
        <div class="fx-profit-lines">
          <div class="fx-profit-line">
            <span>為替差損益</span>
            <strong id="depositFxGainLoss">¥0</strong>
          </div>
          <div class="fx-profit-line">
            <span>FX関連損益</span>
            <strong id="fxHedgeGainLoss">¥0</strong>
          </div>
          <div class="fx-profit-line total">
            <span>TTL</span>
            <strong id="fxGainLoss">¥0</strong>
          </div>
        </div>
        <small id="fxRateStatus">外貨預金なし</small>
      </article>
      <article class="summary-card featured">
        <span>今日の合計利息</span>
        <strong id="todayInterest">¥0</strong>
        <small id="todayInterestGross">税引前 ¥0</small>
      </article>
      <article class="summary-card">
        <span>今月の累計利息</span>
        <strong id="monthInterest">¥0</strong>
        <small id="monthInterestGross">税引前 ¥0</small>
      </article>
      <article class="summary-card">
        <span>運用中の定期</span>
        <strong id="activeDepositCount">0件</strong>
        <small id="totalPrincipal">元本合計 ¥0</small>
      </article>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>運用元本の利回り構成</h2>
        </div>
      </div>
      <div class="chart-shell">
        <canvas id="yieldChart" width="1000" height="260" aria-label="運用元本の利回り構成グラフ"></canvas>
      </div>
      <div id="yieldBreakdown" class="daily-breakdown">グラフを読み込んでいます...</div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>今年の累計損益</h2>
        </div>
      </div>
      <div class="chart-shell">
        <canvas id="profitChart" width="1000" height="280" aria-label="累計損益グラフ"></canvas>
      </div>
      <div id="profitBreakdown" class="daily-breakdown"></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>今後30日の日次利息</h2>
        </div>
        <div class="toolbar">
          <label>
            表示
            <select id="taxMode">
              <option value="net">税引後</option>
              <option value="gross">税引前</option>
            </select>
          </label>
        </div>
      </div>
      <div class="chart-shell">
        <canvas id="interestChart" width="1000" height="280" aria-label="日次利息グラフ"></canvas>
      </div>
      <div id="dailyBreakdown" class="daily-breakdown"></div>
    </section>
    </section>

    <section id="depositsView" class="app-view" hidden>
    <section class="panel view-content-panel">
      <div class="panel-heading">
        <div>
          <p class="view-eyebrow">定期預金</p>
          <h2 id="depositViewTitle">運用中の定期預金</h2>
        </div>
        <div class="toolbar">
          <button id="exportButton" class="secondary-button">CSV出力</button>
          <label class="file-label">
            CSV読込
            <input id="importInput" type="file" accept=".csv,text/csv" />
          </label>
        </div>
      </div>
      <div id="depositList" class="deposit-list"></div>
      <p id="emptyMessage" class="empty-message">まだ定期預金が登録されていません。</p>
    </section>
    </section>

    <section id="fxDetailsView" class="app-view" hidden>
    <section class="panel view-content-panel">
      <div class="panel-heading">
        <div>
          <p class="view-eyebrow">為替関連</p>
          <h2>為替差損益の計算明細</h2>
        </div>
      </div>
      <div id="fxCalculationDetails" class="fx-calculation-list"></div>
    </section>
    </section>
  </main>

  <dialog id="depositDialog">
    <form id="depositForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <h2 id="dialogTitle">定期預金を登録</h2>
        </div>
        <button type="button" id="closeDialogButton" class="icon-button" aria-label="閉じる">×</button>
      </div>

      <input type="hidden" id="depositId" />

      <div class="form-grid">
        <label>
          金融機関名
          <input id="bankName" required placeholder="例：SBI新生銀行" />
        </label>
        <label>
          商品名
          <input id="productName" required placeholder="例：米ドル定期 1か月" />
        </label>
        <label>
          通貨
          <select id="currency">
            <option value="JPY">JPY（円）</option>
            <option value="USD">USD（米ドル）</option>
            <option value="EUR" disabled>EUR（既存データのみ）</option>
            <option value="AUD" disabled>AUD（既存データのみ）</option>
          </select>
        </label>
        <label>
          元本
          <input id="principal" required type="number" min="0" step="0.01" inputmode="decimal" />
        </label>
        <label>
          年利（%）
          <input id="annualRate" required type="number" min="0" step="0.001" inputmode="decimal" />
        </label>
        <label>
          預入日
          <input id="startDate" required type="date" />
        </label>
        <label>
          満期日
          <input id="maturityDate" required type="date" />
        </label>
        <label>
          日数基準
          <select id="dayBasis">
            <option value="365">365日</option>
            <option value="360">360日</option>
          </select>
        </label>
        <label>
          税率（%）
          <input id="taxRate" required type="number" min="0" max="100" step="0.001" value="20.315" />
        </label>
        <label>
          預入時レート（1 USD = 円）
          <input id="initialFxRate" required type="number" min="0.000001" step="0.000001" value="1" />
          <small>預金設定時の為替レート。JPYは1。</small>
        </label>
        <label>
          現在レート（1 USD = 円）
          <input id="fxRate" required type="number" min="0.000001" step="0.000001" value="1" />
          <small>利息と元本の現在円換算に使用します。</small>
        </label>
        <label>
          利息受取時の為替レート（1 USD = 円）
          <input id="interestReceiptFxRate" type="number" min="0.000001" step="0.000001" inputmode="decimal" />
          <small>満期後の税引後利息の円換算に使用します。</small>
        </label>
        <label>
          円転時為替レート（1 USD = 円）
          <input id="conversionFxRate" type="number" min="0.000001" step="0.000001" inputmode="decimal" />
          <small>満期後の元本・利息の確定為替差損益に使用します。</small>
        </label>
        <label>
          満期後
          <select id="afterMaturity">
            <option value="close">満期解約</option>
            <option value="principal">元金継続</option>
            <option value="compound">元利継続</option>
          </select>
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancelButton" class="secondary-button">キャンセル</button>
        <button type="submit" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <template id="depositCardTemplate">
    <article class="deposit-card">
      <div class="deposit-card-top">
        <div>
          <span class="currency-badge"></span>
          <div class="deposit-title-row">
            <h3 class="deposit-title"></h3>
            <div class="card-actions">
              <button type="button" class="edit-button secondary-button">編集</button>
              <button type="button" class="delete-button danger-button">削除</button>
            </div>
          </div>
          <p class="deposit-subtitle"></p>
        </div>
      </div>
      <div class="deposit-metrics">
        <div><span>元本</span><strong class="principal-value"></strong></div>
        <div><span>今日の税引後利息</span><strong class="daily-value"></strong></div>
        <div>
          <span>現在の税引後累計利息</span>
          <strong class="accrued-interest-value"></strong>
        </div>
        <div class="principal-fx-metric">
          <span>元本の為替差損益</span>
          <strong class="principal-fx-value"></strong>
        </div>
        <div class="interest-fx-metric">
          <span>利息の為替差損益</span>
          <strong class="interest-fx-value"></strong>
        </div>
        <div><span>満期利息</span><strong class="maturity-interest-value"></strong></div>
        <div><span>満期まで</span><strong class="remaining-days"></strong></div>
      </div>
      <div class="progress-track"><div class="progress-bar"></div></div>
      <p class="deposit-note"></p>
    </article>
  </template>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      });
    }
    if ("caches" in window) {
      caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
    }
  </script>
  <script src="app-v19.js"></script>
</body>
</html>
